<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Grocery List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .link-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .link-card h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .icon {
            font-size: 2em;
        }

        .description {
            color: #888;
            font-size: 0.9em;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .link-card {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Welcome to Grocery List App</h1>
        <p class="subtitle">Your one-stop solution for managing grocery lists</p>
        
        <div class="links">
            <a href="/swagger-ui.html" class="link-card">
                <span class="icon">📚</span>
                <div>
                    <h2>Swagger UI</h2>
                    <p class="description">Interactive API documentation and testing</p>
                </div>
            </a>
            
            <a href="/redoc.html" class="link-card">
                <span class="icon">📖</span>
                <div>
                    <h2>ReDoc</h2>
                    <p class="description">Beautiful API documentation</p>
                </div>
            </a>
            
            <a href="/v3/api-docs" class="link-card">
                <span class="icon">🔧</span>
                <div>
                    <h2>OpenAPI JSON</h2>
                    <p class="description">Raw API specification in JSON format</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
