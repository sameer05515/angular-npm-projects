<section class="welcome-page">
  <div class="welcome-counter-card">
    <h1>Welcome</h1>
    <p class="welcome-subtitle">You are logged in. Explore the counter and posts below.</p>

    <h2>{{ counter() }}</h2>

    <div class="btn-group">
      <button (click)="decrement()">-</button>
      <button (click)="reset()">Reset</button>
      <button (click)="increment()">+</button>
    </div>
  </div>

  <app-posts />
</section>
