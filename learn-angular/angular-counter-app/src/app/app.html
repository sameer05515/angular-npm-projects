<header class="top-nav">
  @if (!hasToken()) {
    <a routerLink="/login" routerLinkActive="active-link">Login</a>
    <a routerLink="/signup" routerLinkActive="active-link">Sign Up</a>
  } @else {
    <a routerLink="/welcome" routerLinkActive="active-link">Welcome</a>
    <button type="button" class="logout-btn" (click)="logout()">Logout</button>
  }
</header>

<main>
  <router-outlet />
</main>
