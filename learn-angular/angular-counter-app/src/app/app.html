<div class="container">
  <div class="card">
    <h1>Angular Counter</h1>    

    <h2>{{ counter() }}</h2>

    <div class="btn-group">
      <button (click)="decrement()">-</button>

      <button (click)="reset()">Reset</button>

      <button (click)="increment()">+</button>
    </div>
  </div>

  
</div>
